name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ci-cd/01-github-actions/ci-lab/requirements.txt

      - name: Lint with flake8
        run: flake8 ci-cd/01-github-actions/ci-lab/ --max-line-length=88

      - name: Run tests
        run: pytest ci-cd/01-github-actions/ci-lab/tests/ -v

      - name: Build Docker image
        run: docker build -t ghcr.io/ashyt-cloud/ci-lab:${{ github.sha }} ci-cd/01-github-actions/ci-lab

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        run: docker push ghcr.io/ashyt-cloud/ci-lab:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Depoloy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ashyt-cloud --password-stdin
            docker pull ghcr.io/ashyt-cloud/ci-lab:${{ github.sha }}
            docker stop ci-lab || true
            docker rm ci-lab || true
            docker run -d --name ci-lab -p 8080:8080 ghcr.io/ashyt-cloud/ci-lab:${{ github.sha }}
            echo "Deployed ${{ github.sha }}"
