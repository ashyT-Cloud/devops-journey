name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ci-cd/01-github-actions/ci-lab/requirements.txt

      - name: Lint with flake8
        run: flake8 ci-cd/01-github-actions/ci-lab/ --max-line-length=88

      - name: Run tests
        run: pytest ci-cd/01-github-actions/ci-lab/tests/ -v

      - name: Build Docker image
        run: docker build -t ghcr.io/ashyt-cloud/ci-lab:${{ github.sha }} ci-cd/01-github-actions/ci-lab

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        run: docker push ghcr.io/ashyt-cloud/ci-lab:${{ github.sha }}
